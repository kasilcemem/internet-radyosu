<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAŞ FM</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
    text-align:center;
}

header{
    background:linear-gradient(90deg,#ffb300,#ff6f00);
    padding:25px;
}

.logo{
    width:110px;
}

.player{
    margin:40px auto;
    width:90%;
    max-width:500px;
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
}

audio{
    width:100%;
}

button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#ffb300;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

<svg class="logo" viewBox="0 0 200 200">
<circle cx="100" cy="100" r="90" fill="#ffb300"/>
<text x="100" y="95" text-anchor="middle" font-size="48" fill="black">KAŞ</text>
<text x="100" y="140" text-anchor="middle" font-size="32" fill="black">FM</text>
</svg>

<h1>KAŞ FM</h1>
<p>Canlı Yayın</p>

</header>

<div class="player">

<h2>🎧 Şu an yayında</h2>

<audio id="radio" controls autoplay muted>
<!-- ÜCRETSİZ CANLI RADYO STREAM -->
<source src="https://icecast.radiofrance.fr/fip-hifi.aac" type="audio/mpeg">
Tarayıcı desteklemiyor.
</audio>

<br>

<button onclick="document.getElementById('radio').play()">
▶ Yayını Başlat
</button>

<p>Not: Bazı tarayıcılar otomatik sesi engeller, butona bas</p>

</div>

</body>
</html>
