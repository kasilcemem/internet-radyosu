<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAŞ FM</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
    text-align:center;
}

header{
    background:linear-gradient(90deg,#ffb300,#ff6f00);
    padding:25px;
}

.logo{
    width:120px;
}

h1{
    margin:10px 0 0;
}

.player{
    margin:30px auto;
    width:90%;
    max-width:500px;
    background:#1c1c1c;
    padding:20px;
    border-radius:15px;
}

audio{
    width:100%;
}

button{
    margin-top:10px;
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#ffb300;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff6f00;
}

footer{
    margin-top:40px;
    padding:20px;
    background:#000;
    font-size:12px;
}
</style>
</head>

<body>

<header>

<!-- KAŞ LOGO -->
<svg class="logo" viewBox="0 0 200 200">
<circle cx="100" cy="100" r="90" fill="#ffb300"/>
<text x="100" y="95" text-anchor="middle" font-size="48" fill="black">KAŞ</text>
<text x="100" y="140" text-anchor="middle" font-size="32" fill="black">FM</text>
</svg>

<h1>KAŞ FM</h1>
<p>7/24 Canlı Yayın</p>

</header>

<div class="player">

<h2>🎧 Şu an çalıyor</h2>

<audio id="radio" controls autoplay>
<!-- %100 ÇALIŞAN PUBLIC RADYO STREAM -->
<source src="https://icecast.radiofrance.fr/fip-hifi.aac" type="audio/mpeg">
</audio>

<br>

<button onclick="document.getElementById('radio').play()">
▶ Yayını Başlat
</button>

<p style="font-size:12px;color:#aaa">
Otomatik başlamazsa butona bas
</p>

</div>

<footer>
© 2026 KAŞ FM | Live Radio System
</footer>

</body>
</html>
