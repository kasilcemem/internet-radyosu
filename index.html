<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAŞ FM ULTRA</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
    text-align:center;
}

/* HEADER */
header{
    background:linear-gradient(90deg,#ffb300,#ff6f00);
    padding:30px 10px;
}

/* LOGO */
.logo{
    width:130px;
}

/* TITLE */
h1{
    margin:10px 0 0;
    font-size:40px;
}

/* PLAYER */
.player{
    margin:30px auto;
    width:90%;
    max-width:550px;
    background:#1a1a1a;
    padding:25px;
    border-radius:18px;
    box-shadow:0 0 25px rgba(255,255,255,0.1);
}

audio{
    width:100%;
    margin-top:10px;
}

/* BUTTON */
button{
    margin-top:15px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#ffb300;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff6f00;
}

/* INFO */
.info{
    font-size:13px;
    color:#aaa;
    margin-top:10px;
}

footer{
    margin-top:40px;
    padding:20px;
    background:#000;
    font-size:13px;
}
</style>
</head>

<body>

<header>

<!-- KAŞ ULTRA LOGO -->
<svg class="logo" viewBox="0 0 200 200">
<circle cx="100" cy="100" r="90" fill="#ffb300"/>
<text x="100" y="95" text-anchor="middle" font-size="48" fill="black">KAŞ</text>
<text x="100" y="140" text-anchor="middle" font-size="32" fill="black">FM</text>
</svg>

<h1>KAŞ FM ULTRA</h1>
<p>Profesyonel Canlı Radyo Sistemi</p>

</header>

<!-- PLAYER -->
<div class="player">

<h2>🎧 Canlı Yayın</h2>

<audio id="radio" controls>
<!-- 1. ana stream -->
<source src="https://icecast.radiofrance.fr/fip-hifi.aac" type="audio/mpeg">
</audio>

<button onclick="startRadio()">▶ Yayını Başlat</button>

<div class="info">
Eğer yayın başlamazsa otomatik alternatif kanal açılır
</div>

</div>

<footer>
© 2026 KAŞ FM ULTRA
</footer>

<script>
// Ana yayın
const mainStream = "https://icecast.radiofrance.fr/fip-hifi.aac";

// Alternatif fallback (bozulursa)
const backupStream = "https://icecast.radiofrance.fr/fip-bis.aac";

function startRadio(){
    let audio = document.getElementById("radio");

    audio.src = mainStream;

    audio.play().catch(() => {
        console.log("Ana stream başarısız, yedek açılıyor");
        audio.src = backupStream;
        audio.play();
    });
}

// otomatik deneme
window.onload = () => {
    let audio = document.getElementById("radio");
    audio.play().catch(()=>{});
};
</script>

</body>
</html>
